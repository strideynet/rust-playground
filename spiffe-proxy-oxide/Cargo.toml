[package]
name = "spiffe-proxy-oxide"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.39.2", features = ["rt", "rt-multi-thread", "macros", "full"] }
tokio-rustls = "0.26.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
spiffe = "0.6.5"
rustls = "0.23.25"
x509-parser = "0.14"
prometheus = "0.14.0"
axum = "0.8.3"
color-eyre = "0.6.3"
async-trait = "0.1.88"
webpki-roots = "0.26.8"
figment = { version = "0.10.19", features = ["yaml", "serde_json", "serde_yaml"] }
serde = "1.0.219"

